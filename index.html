<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Mensagens</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Minhas Mensagens</h1>
        
        <div class="input-group">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Digite sua mensagem..."
                autocomplete="off"
            >
            <button onclick="addMessage()">Adicionar</button>
        </div>

        <div id="messagesList" class="messages-list">
            <div class="empty-state">Nenhuma mensagem ainda</div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const messagesList = document.getElementById('messagesList');
        let messages = [];

        function addMessage() {
            const text = messageInput.value.trim();
            
            if (text === '') {
                alert('Por favor, digite uma mensagem');
                return;
            }

            messages.push(text);
            messageInput.value = '';
            messageInput.focus();
            renderMessages();
        }

        function deleteMessage(index) {
            messages.splice(index, 1);
            renderMessages();
        }

        function renderMessages() {
            if (messages.length === 0) {
                messagesList.innerHTML = '<div class="empty-state">Nenhuma mensagem ainda</div>';
                return;
            }

            messagesList.innerHTML = messages
                .map((msg, index) => `
                    <div class="message-item">
                        <span class="message-text">${escapeHtml(msg)}</span>
                        <button class="delete-btn" onclick="deleteMessage(${index})">×</button>
                    </div>
                `)
                .join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Permitir adicionar mensagem com Enter
        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addMessage();
            }
        });

        // Focar no input ao carregar a página
        messageInput.focus();
    </script>
</body>
</html>
